<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gulabdas Kids Wear</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ff4d4d, #ffd633);
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Glass Card */
.glass-card {
    backdrop-filter: blur(15px);
    background: rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    padding: 25px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
}

/* Logo */
.logo {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: white;
    color: #ff4d4d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    margin: auto;
    font-size: 24px;
}

/* Buttons */
.link-btn {
    border-radius: 12px;
    font-weight: 600;
    transition: 0.2s;
}

.link-btn:hover {
    transform: scale(1.03);
}
</style>
</head>

<body>

<div class="glass-card text-center">

    <div class="logo mb-3">
        <img src="1.jpg" alt="Gulabdas Kids Wear" style=width:7; height:7;">
    </div>

    <h3 class="fw-bold text-white">Gulabdas Kids Wear</h3>
    <p class="text-light mb-4">Stylish • Comfortable</p>

    <div class="d-grid gap-3">

        <a href="https://www.instagram.com/gulabdaskidswear" target="_blank"
           class="btn btn-light link-btn">📸 Instagram</a>

        <a href="https://www.facebook.com/share/14ksdtpEjm1" target="_blank"
           class="btn btn-light link-btn">📘 Facebook</a>

        <a href="https://wa.me/+919601666494" target="_blank"
           class="btn btn-warning link-btn">💬 WhatsApp Order</a>

        <button onclick="showCatalog()" class="btn btn-danger link-btn">
           View Catalog
        </button>

    </div>
</div>

<script>
function showCatalog() {
    alert("Catalog coming soon! Contact on WhatsApp 💬");
}
</script>

</body>
</html>
